# This is a Databricks asset bundle definition for databricks_bundles_cicd_training.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_bundles_cicd_training
  uuid: d7e2b62a-7a75-4a56-90f0-19d80fe14849

include:
  - resources/*.yml
  - resources/*/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-593a8733-98a2.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-593a8733-98a2.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/manzimike378@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/manzimike378@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: manzimike378@gmail.com
        level: CAN_MANAGE
