name: Deploy to Dev

on:
  push:
    branches: [main]

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.cargo/bin:$PATH"
          uv --version
      
      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
      
      - name: Deploy bundle to dev
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "Deploying bundle to target=dev"
          databricks bundle deploy -t dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      
      - name: Run verification job
        run: |
          echo "Triggering verification job..."
          
          # Run the job and capture full output
          OUTPUT=$(databricks bundle run verification_job -t dev 2>&1)
          echo "$OUTPUT"
          
          # Extract run ID using jq or grep
          RUN_ID=$(echo "$OUTPUT" | grep -oP 'Run URL:.*runs/\K[0-9]+' || echo "")
          
          if [ -z "$RUN_ID" ]; then
            # Try alternative parsing
            RUN_ID=$(echo "$OUTPUT" | grep -oP 'run_id["\s:]+\K[0-9]+' | head -1 || echo "")
          fi
          
          echo "Extracted Run ID: $RUN_ID"
          
          if [ -z "$RUN_ID" ]; then
            echo "Failed to extract run ID from output"
            echo "Full output was:"
            echo "$OUTPUT"
            exit 1
          fi
          
          echo "Waiting for job completion..."
          MAX_WAIT=600  # 10 minutes timeout
          ELAPSED=0
          
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            RUN_STATUS=$(databricks runs get $RUN_ID --output json 2>&1)
            
            STATUS=$(echo "$RUN_STATUS" | grep -oP '"life_cycle_state"\s*:\s*"\K[^"]+' || echo "UNKNOWN")
            RESULT=$(echo "$RUN_STATUS" | grep -oP '"result_state"\s*:\s*"\K[^"]+' || echo "")
            
            echo "[$ELAPSED s] Status: $STATUS, Result: $RESULT"
            
            if [ "$STATUS" = "TERMINATED" ] || [ "$STATUS" = "SKIPPED" ] || [ "$STATUS" = "INTERNAL_ERROR" ]; then
              if [ "$RESULT" = "SUCCESS" ]; then
                echo "Job completed successfully"
                exit 0
              else
                echo "Job failed with result: $RESULT"
                echo "Full status:"
                echo "$RUN_STATUS"
                exit 1
              fi
            fi
            
            sleep 15
            ELAPSED=$((ELAPSED + 15))
          done
          
          echo "Job did not complete within timeout"
          exit 1
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      
      - name: Verify output table
        run: |
          echo "Verifying output table exists and has data..."
          
          # Get the schema name (user's short name)
          SCHEMA=$(databricks current-user me --output json | grep -o '"userName":"[^"]*"' | cut -d':' -f2 | tr -d '"' | cut -d'@' -f1)
          
          echo "Checking table: workspace.${SCHEMA}.cicd_verification_table"
          
          # Check if table exists and get row count
          ROW_COUNT=$(databricks sql execute --statement "SELECT COUNT(*) as count FROM workspace.${SCHEMA}.cicd_verification_table" --output json 2>&1 | grep -o '"count":[0-9]*' | cut -d':' -f2 || echo "0")
          
          echo "Row count: $ROW_COUNT"
          
          if [ "$ROW_COUNT" -gt 0 ]; then
            echo "Verification passed: Table exists with $ROW_COUNT rows"
          else
            echo "Verification failed: Table is empty or does not exist"
            exit 1
          fi
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
