name: Deploy to Dev

on:
  push:
    branches: [main]

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: DEV_DATABRICKS
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.cargo/bin:$PATH"
          uv --version
      
      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
      
      - name: Deploy bundle to dev
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "Deploying bundle to target=dev"
          databricks bundle deploy -t dev
      
      - name: Run verification job
        run: |
          databricks workspace export /Workspace/Users/manzimike378@gmail.com/.bundle/databricks_bundles_cicd_training/dev/files/src/verification_notebook
          echo "Verification complete."

